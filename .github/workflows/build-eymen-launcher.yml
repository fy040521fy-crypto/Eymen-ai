name: EYMEN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodları al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: SDK paketlerini yükle
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Projeyi hazırla
        run: |
          mkdir launcher
          ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          unzip -q "$ZIP" -d launcher

      - name: APK oluştur
        run: gradle -p launcher assembleDebug

      - name: APK dosyasını yayınla
        uses: actions/upload-artifact@v4
        with:
          name: EYMEN-APK
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
